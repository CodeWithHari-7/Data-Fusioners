version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fusion_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fusiondb
      POSTGRES_USER: fusion
      POSTGRES_PASSWORD: fusionpassword2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fusion -d fusiondb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fusion_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fusion:fusionpassword2026@postgres:5432/fusiondb
      USE_PGVECTOR: "true"
      SECRET_KEY: "prod-secret-data-fusioners-system-2026"
      RATE_LIMIT_PER_MINUTE: 120
      RATE_LIMIT_BURST: 30
      CONFLICT_TOLERANCE_PERCENT: 2.0
      ANOMALY_ZSCORE_THRESHOLD: 2.5
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fusion_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: fusion_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  backend_data:
