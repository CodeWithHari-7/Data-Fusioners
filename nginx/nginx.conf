events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Edge Rate Limiting (Tracen Topic 1: Token Bucket at Reverse Proxy)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Upstream services
    upstream backend_api {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend_ui {
        server frontend:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 50M;

        # Security Headers (Tracen Topic 4/5)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # API Gateway routing (Tracen Topic 5)
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # OpenAPI Docs
        location ~ ^/(docs|openapi.json|redoc) {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
        }

        # Frontend Next.js routing
        location / {
            proxy_pass http://frontend_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
